name: probe3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pages api probe
        run: |
          {
            echo "== GET pages =="
            curl -sS -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/pages" -w "\nhttp=%{http_code}\n" || echo "get fail exit=$?"
            echo "== POST pages =="
            curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"source":{"branch":"main","path":"/"}}' "https://api.github.com/repos/${{ github.repository }}/pages" -w "\nhttp=%{http_code}\n" || echo "post fail exit=$?"
            echo "== GET pages after =="
            curl -sS -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/pages" -w "\nhttp=%{http_code}\n" || echo "get2 fail exit=$?"
          } > diag3.log 2>&1 || true
      - name: push diag
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci"
          git checkout -B diag
          git add diag3.log
          git commit -m "probe3 $(date -u +%s)" || true
          git push origin diag --force

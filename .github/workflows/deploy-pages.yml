name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download site files
        run: |
          mkdir -p out
          curl -fsSL "https://aka.doubaocdn.com/s/yBsIDh3qrt" -o out/student.html
          curl -fsSL "https://aka.doubaocdn.com/s/Sw70td8S5a" -o out/teacher.html
          cat > out/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>全国中学生天文知识竞赛 · 在线答题系统</title>
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b1c;color:#e9efff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
          .box{text-align:center;padding:40px}
          h1{font-size:26px;letter-spacing:.5px}
          p{color:#9db0d8;font-size:14px}
          .links{display:flex;gap:16px;justify-content:center;margin-top:28px;flex-wrap:wrap}
          a{display:inline-block;padding:14px 30px;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px}
          .stu{background:linear-gradient(135deg,#2b8fe0,#3f6fe0);color:#fff}
          .tch{background:linear-gradient(135deg,#e8b24b,#d98f2c);color:#1c1304}
          .note{margin-top:26px;color:#6678a0;font-size:12.5px}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>全国中学生天文知识竞赛 · 在线答题系统</h1>
          <p>请选择你的入口</p>
          <div class="links">
          <a class="stu" href="./student.html">学生端 · 进入考试</a>
          <a class="tch" href="./teacher.html">教师端 · 管理后台</a>
          </div>
          <p class="note">建议使用 Chrome / Edge 浏览器打开</p>
          </div>
          </body>
          </html>
          EOF
          ls -la out
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

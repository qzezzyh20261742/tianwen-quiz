name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create image directory
        run: mkdir -p site/question-images
      - name: Backup question images
        run: node scripts/backup-question-images.mjs
        env:
          PAGES_BASE_URL: https://zyh572.github.io/tianwen
      - name: Prepare site files
        run: |
          mkdir -p out
          S_URL=$(sed -n '1p' site/source.txt 2>/dev/null)
          T_URL=$(sed -n '2p' site/source.txt 2>/dev/null)
          if [ -n "$S_URL" ] && curl -fsSL -m 30 -A "Mozilla/5.0" "$S_URL" -o out/student.html; then
            echo "student: downloaded from source"
          else
            cp site/student.html out/student.html
            echo "student: using repo copy"
          fi
          if [ -n "$T_URL" ] && curl -fsSL -m 30 -A "Mozilla/5.0" "$T_URL" -o out/teacher.html; then
            echo "teacher: downloaded from source"
          else
            cp site/teacher.html out/teacher.html
            echo "teacher: using repo copy"
          fi
          cp site/cloud.json out/cloud.json
          if [ -d site/question-images ]; then
            cp -R site/question-images out/question-images
          fi
          test -s out/student.html
          test -s out/teacher.html
          test -s out/cloud.json
          cat > out/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>全国中学生天文知识竞赛 · 在线答题系统</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0}
          body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b1c;color:#e9efff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
          .box{text-align:center;padding:40px 24px;max-width:720px}
          h1{font-size:26px;letter-spacing:.5px;line-height:1.5}
          p.sub{color:#9db0d8;font-size:14px;margin-top:12px}
          .links{display:flex;gap:16px;justify-content:center;margin-top:32px;flex-wrap:wrap}
          a{display:inline-block;padding:15px 32px;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px;transition:transform .2s}
          a:hover{transform:translateY(-2px)}
          .stu{background:linear-gradient(135deg,#2b8fe0,#3f6fe0);color:#fff}
          .tch{background:linear-gradient(135deg,#e8b24b,#d98f2c);color:#1c1304}
          .note{margin-top:30px;color:#6678a0;font-size:12.5px;line-height:1.8}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>全国中学生天文知识竞赛 · 在线答题系统</h1>
          <p class="sub">请选择你的入口</p>
          <div class="links">
          <a class="stu" href="./student.html">学生端 · 进入考试</a>
          <a class="tch" href="./teacher.html">教师端 · 管理后台</a>
          </div>
          <p class="note">建议使用 Chrome / Edge 浏览器打开<br>考试前请确认能正常连接考试服务器</p>
          </div>
          </body>
          </html>
          EOF
          ls -la out
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Upload question image manifest
        uses: actions/upload-artifact@v4
        with:
          name: question-image-manifest
          path: site/question-images/manifest.json
          if-no-files-found: ignore
      - name: Archive site files in repo
        run: |
          cp out/student.html site/student.html
          cp out/teacher.html site/teacher.html
          git add site
          if ! git diff --cached --quiet; then
            git config user.email "ci@users.noreply.github.com"
            git config user.name "deploy-bot"
            git commit -m "sync site files [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: question-image-manifest
          path: question-image-manifest
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Apply GitHub image URLs to cloud data
        run: node scripts/apply-question-image-map.mjs
        env:
          MANIFEST_PATH: ${{ github.workspace }}/question-image-manifest/manifest.json
          PAGES_BASE_URL: https://zyh572.github.io/tianwen

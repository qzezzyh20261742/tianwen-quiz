<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全国中学生天文知识竞赛 · 教师管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='13' fill='%235bc8ff'/%3E%3Cellipse cx='32' cy='32' rx='26' ry='8' fill='none' stroke='%23ffd479' stroke-width='4' transform='rotate(-20 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070b1c;
  --card:rgba(17,24,51,.82);
  --card-solid:#111833;
  --line:rgba(132,168,255,.18);
  --line-strong:rgba(132,168,255,.4);
  --text:#e9efff;
  --muted:#9db0d8;
  --accent:#5bc8ff;
  --accent-deep:#1d8fd6;
  --gold:#ffd479;
  --green:#4ade80;
  --red:#ff7178;
  --violet:#a78bfa;
  --radius:14px;
  --shadow:0 18px 50px rgba(2,6,20,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
/* ===== 宇宙背景 ===== */
#starCanvas{position:fixed;inset:0;z-index:0;display:block}
.nebula{position:fixed;z-index:0;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.nebula.n1{width:560px;height:560px;top:-160px;left:-120px;background:radial-gradient(circle,#2440b8 0%,transparent 70%)}
.nebula.n2{width:620px;height:620px;bottom:-220px;right:-160px;background:radial-gradient(circle,#5b2aa0 0%,transparent 70%)}
.nebula.n3{width:420px;height:420px;top:38%;left:55%;background:radial-gradient(circle,#0e6e8f 0%,transparent 70%);opacity:.35}

.app-wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 22px 60px}
.view{display:none;animation:fade .45s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.brand svg{flex:none}
h1{font-size:26px;font-weight:800;letter-spacing:.5px;text-align:center}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px}
h2.sec-title{font-size:19px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
h2.sec-title::before{content:"";width:5px;height:19px;border-radius:3px;background:var(--accent)}

.tabs{display:flex;gap:10px;background:rgba(8,12,30,.7);padding:6px;border-radius:12px;margin-bottom:24px;border:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer;font-size:15px;color:var(--muted);transition:.2s;user-select:none}
.tab.on{background:linear-gradient(135deg,var(--accent-deep),#2b6fd0);color:#fff;font-weight:700}
.admin-tabs{position:sticky;top:8px;z-index:30;margin-bottom:18px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(2,6,20,.35)}
.admin-tabs .tab{border:0;background:transparent;font-family:inherit;font-size:15.5px;padding:11px 10px;appearance:none}
.admin-tabs .tab.on{background:linear-gradient(135deg,var(--accent-deep),#2b6fd0)}
.admin-tabs .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.admin-page{display:none}
.admin-page.active{display:block;animation:fade .3s ease}
@media (prefers-reduced-motion:reduce){.admin-page.active{animation:none}}

.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px;font-weight:600}
.field input{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(8,13,32,.85);color:var(--text);font-size:16px;outline:none;transition:.2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,200,255,.15)}
.field input::placeholder{color:#6b7ca3}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:62px}
.pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:34px;padding:0 11px;border:1px solid var(--line-strong);border-radius:8px;background:rgba(8,13,32,.9);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.pass-toggle:hover{color:var(--text);border-color:var(--accent)}
.radio-row{display:flex;gap:12px}
.radio-pill{flex:1;position:relative}
.radio-pill input{position:absolute;opacity:0;inset:0;cursor:pointer}
.radio-pill span{display:block;text-align:center;padding:13px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(8,13,32,.85);font-size:15px;cursor:pointer;transition:.2s}
.radio-pill input:checked+span{border-color:var(--accent);background:rgba(91,200,255,.16);color:#fff;font-weight:700}
.radio-pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;border-radius:11px;padding:13px 26px;font-size:16px;font-weight:700;font-family:inherit;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#2b8fe0,#3f6fe0);color:#fff;width:100%;box-shadow:0 10px 26px rgba(45,118,224,.4)}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-gold{background:linear-gradient(135deg,#e8b24b,#d98f2c);color:#1c1304;box-shadow:0 10px 26px rgba(217,143,44,.35)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn-danger{background:transparent;border:1px solid rgba(255,113,120,.6);color:var(--red)}
.btn-danger:hover{background:rgba(255,113,120,.13);border-color:var(--red)}

/* ===== 顶栏 ===== */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
.who{display:flex;flex-direction:column}
.who b{font-size:16px}
.who span{font-size:13px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:15px}

.progress-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.progress{height:9px;border-radius:6px;background:rgba(120,150,220,.15);overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),#6f8bff);transition:width .35s}

/* ===== 题目 ===== */
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.q-no{background:linear-gradient(135deg,var(--accent-deep),#3f6fd0);color:#fff;font-weight:800;border-radius:9px;padding:5px 13px;font-size:14px}
.q-tag{font-size:12.5px;color:var(--gold);border:1px solid rgba(255,212,121,.4);border-radius:20px;padding:2px 11px}
.q-stem{font-size:17.5px;font-weight:700;margin-bottom:20px;line-height:1.75}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(9,14,34,.75);cursor:pointer;transition:.18s;min-height:48px}
.option:hover{border-color:var(--accent);background:rgba(91,200,255,.09)}
.option .key{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--muted)}
.option .otext{font-size:16px;padding-top:2px}
.option.selected{border-color:var(--accent);background:rgba(91,200,255,.15)}
.option.selected .key{background:var(--accent);color:#061226;border-color:var(--accent)}
.option.correct{border-color:var(--green);background:rgba(74,222,128,.13)}
.option.correct .key{background:var(--green);color:#06210f;border-color:var(--green)}
.option.wrong{border-color:var(--red);background:rgba(255,113,120,.13)}
.option.wrong .key{background:var(--red);color:#2a0708;border-color:var(--red)}
.option.locked{cursor:default}
.option.locked:hover{background:rgba(9,14,34,.75);border-color:var(--line-strong)}
.option.correct.locked:hover{background:rgba(74,222,128,.13);border-color:var(--green)}
.option.wrong.locked:hover{background:rgba(255,113,120,.13);border-color:var(--red)}
.option.unknown{border-color:var(--gold);background:rgba(255,212,121,.13)}
.option.unknown .key{background:var(--gold);color:#2a1c04;border-color:var(--gold)}
.option.unknown.locked:hover{background:rgba(255,212,121,.13);border-color:var(--gold)}
.option-e{border-style:dashed}
.option-e .key{color:var(--gold);border-color:rgba(255,212,121,.55)}

.q-actions{display:flex;gap:12px;margin-top:22px;justify-content:space-between}
.q-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.nav-dot{width:40px;height:40px;border-radius:9px;border:1px solid var(--line-strong);background:rgba(9,14,34,.7);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-dot.done{color:var(--accent);border-color:var(--accent)}
.nav-dot.current{background:var(--accent);color:#061226}

/* ===== 结果总览 ===== */
.score-hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-around;text-align:center;padding:10px 0}
.score-big{font-size:52px;font-weight:800;color:var(--gold);line-height:1.1}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;min-width:260px}
.stat{background:rgba(9,14,34,.7);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.stat.g b{color:var(--green)}.stat.r b{color:var(--red)}.stat.b b{color:var(--accent)}.stat.p b{color:var(--gold)}.stat.u b{color:var(--gold)}

.review-block{margin-top:20px}
.verdict{font-size:13.5px;font-weight:700;margin-bottom:10px;display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:20px}
.verdict.ok{color:var(--green);background:rgba(74,222,128,.12)}
.verdict.no{color:var(--red);background:rgba(255,113,120,.12)}
.verdict.unknown{color:var(--gold);background:rgba(255,212,121,.12)}
.ans-line{font-size:14.5px;margin-bottom:8px;color:var(--muted)}
.ans-line b{color:var(--text)}
.detail-box{background:rgba(8,13,32,.7);border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-top:10px;font-size:14.5px}
.detail-box h4{font-size:14px;color:var(--accent);margin:10px 0 5px}
.detail-box h4:first-child{margin-top:0}
.detail-box li{list-style:none;margin-bottom:7px;padding-left:16px;position:relative}
.detail-box li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ===== 管理员 ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:rgba(9,14,34,.75);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.kpi b{display:block;font-size:25px;color:var(--accent)}
.kpi span{font-size:13px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:830px}
thead th{background:#1a2550;color:var(--text);padding:12px 10px;text-align:center;font-weight:700;white-space:nowrap}
tbody td{padding:11px 10px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
tbody tr:hover{background:rgba(91,200,255,.06)}
tbody td.name-cell{text-align:left;font-weight:600}
.pill-tag{font-size:12px;border-radius:20px;padding:2px 10px;border:1px solid var(--line-strong);color:var(--muted)}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 8px 0;margin-bottom:20px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col i{width:70%;background:linear-gradient(180deg,var(--accent),#3f6fd0);border-radius:6px 6px 0 0;min-width:18px}
.bar-col span{font-size:12px;color:var(--muted);white-space:nowrap}

/* ===== 模态框 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(3,6,18,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:860px;max-height:88vh;overflow-y:auto;background:var(--card-solid);border:1px solid var(--line-strong);border-radius:16px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-close{background:none;border:1px solid var(--line-strong);color:var(--text);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:17px}

.toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(20px);background:#1d294f;border:1px solid var(--line-strong);color:var(--text);padding:12px 22px;border-radius:11px;font-size:14.5px;opacity:0;transition:.3s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}

.empty{text-align:center;color:var(--muted);padding:46px 0;font-size:15px}
.footer-note{text-align:center;color:#6678a0;font-size:12.5px;margin-top:34px}

/* ===== 结果页悬浮功能键 ===== */
.float-actions{position:fixed;right:22px;bottom:92px;z-index:40;display:none;flex-direction:column;gap:10px}
.float-actions.show{display:flex}
.float-btn{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px;background:rgba(18,26,58,.93);border:1px solid var(--line-strong);color:var(--text);border-radius:12px;padding:11px 12px;cursor:pointer;font-size:12px;font-family:inherit;box-shadow:var(--shadow);transition:.2s}
.float-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.float-btn svg{width:22px;height:22px}
.float-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 管理员筛选 ===== */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filter-row select{padding:9px 13px;border-radius:9px;border:1px solid var(--line-strong);background:rgba(8,13,32,.85);color:var(--text);font-size:14px;font-family:inherit;min-width:150px;cursor:pointer;outline:none}
.filter-row select:focus{border-color:var(--accent)}
.filter-row select option{background:#0d1533}

/* ===== 详情可展开题目 ===== */
.q-expand-head{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;border:none;color:var(--text);padding:13px 15px;cursor:pointer;font-family:inherit;font-size:14.5px;text-align:left}
.q-expand-head:hover{background:rgba(91,200,255,.07)}
.q-expand-head .chev{margin-left:auto;transition:.25s;flex:none}
.q-expand-head.open .chev{transform:rotate(180deg)}
.q-expand-body{padding:0 15px 15px;border-top:1px solid var(--line)}
.q-expand-body .mini-stem{font-weight:700;margin:13px 0 10px;font-size:14.5px;line-height:1.7}
.q-expand-body .mini-opt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:9px;margin-bottom:7px;font-size:13.5px;border:1px solid var(--line);line-height:1.6}
.q-expand-body .mini-opt .mk{flex:none;font-weight:800}
.q-expand-body .mini-opt.is-correct{border-color:var(--green);background:rgba(74,222,128,.1)}
.q-expand-body .mini-opt.is-wrong{border-color:var(--red);background:rgba(255,113,120,.1)}
.q-expand-body .mini-opt.is-unknown{border-color:var(--gold);background:rgba(255,212,121,.1)}
.q-expand-body h5{color:var(--accent);font-size:13.5px;margin:13px 0 5px}
.q-expand-body .mini-li{font-size:13.5px;margin-bottom:6px;padding-left:15px;position:relative}
.q-expand-body .mini-li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.q-expand-body .mini-meta{font-size:13.5px;color:var(--muted);margin-top:10px}

/* ===== 响应式 ===== */
@media (max-width:760px){
  .app-wrap{padding:18px 13px 46px}
  .card{padding:18px 15px}
  h1{font-size:21px}
  .q-stem{font-size:16.5px}
  .option .otext{font-size:15.5px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr);min-width:0;width:100%}
  .q-actions{flex-direction:column}
  .q-actions .btn{width:100%}
  .nav-dot{width:36px;height:36px}
  .topbar{gap:8px}
  .float-actions{right:12px;bottom:70px;gap:8px}
  .float-btn{min-width:56px;padding:9px 10px}
}
/* 移除发布平台注入的右下角水印 */
[data-custom-element]{display:none !important;visibility:hidden !important;pointer-events:none !important}
</style>
</head>
<body>
<script>
/* 移除发布平台注入的右下角水印（运行时删除 + 监听兜底） */
(function(){
  function stripWm(){
    var els = document.querySelectorAll('[data-custom-element]');
    for(var i=0;i<els.length;i++){ if(els[i].parentNode){ els[i].parentNode.removeChild(els[i]); } }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', stripWm);
  } else {
    stripWm();
  }
  if(window.MutationObserver){
    new MutationObserver(stripWm).observe(document.documentElement, {childList:true, subtree:true});
  }
  setInterval(stripWm, 800);
})();
</script>
<canvas id="starCanvas" aria-hidden="true"></canvas>
<div class="nebula n1" aria-hidden="true"></div>
<div class="nebula n2" aria-hidden="true"></div>
<div class="nebula n3" aria-hidden="true"></div>

<div class="app-wrap">

<!-- ===== 视图：登录 ===== -->
<section id="view-login" class="view active">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="12" fill="#5bc8ff"/><ellipse cx="32" cy="32" rx="27" ry="8" fill="none" stroke="#ffd479" stroke-width="4" transform="rotate(-20 32 32)"/></svg>
  </div>
  <h1>全国中学生天文知识竞赛 · 教师管理后台</h1>
  <p class="subtitle">教师管理后台 · 学生成绩、答案与错题汇总</p>

  <div class="card">
    <form id="adminForm" autocomplete="off">
      <div class="field">
        <label for="admUser">管理员账号</label>
        <input id="admUser" type="text" placeholder="请输入管理员用户名" required>
      </div>
      <div class="field">
        <label for="admPass">管理员密码</label>
        <div class="pass-wrap">
          <input id="admPass" type="password" placeholder="请输入密码" required>
          <button type="button" id="toggleAdmPass" class="pass-toggle" aria-label="显示或隐藏密码">显示</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">登录管理后台</button>
    </form>
  </div>
  <p class="footer-note">学生提交成绩后，登录后台即可汇总查看、筛选与导出。</p>
</section>
<!-- ===== 视图：管理员 ===== -->
<section id="view-admin" class="view">
  <div class="topbar">
    <div class="who"><b>教师管理后台</b><span>成绩、考试场次与账号权限管理</span></div>
    <button class="btn btn-ghost btn-sm" id="adminLogout" type="button">退出后台</button>
  </div>

  <div class="tabs admin-tabs" id="adminTabs" role="tablist" aria-label="管理员功能板块">
    <button class="tab admin-tab on" id="tabScores" type="button" role="tab" aria-selected="true" aria-controls="adminPageScores" data-page="scores">成绩与考试</button>
    <button class="tab admin-tab" id="tabManage" type="button" role="tab" aria-selected="false" aria-controls="adminPageManage" data-page="manage" tabindex="-1">权限与账号</button>
  </div>

  <!-- ===== 板块一：成绩与考试 ===== -->
  <div class="admin-page active" id="adminPageScores" role="tabpanel" aria-labelledby="tabScores">
    <div class="kpi-row">
      <div class="kpi"><b id="kpiCount">0</b><span>提交人数</span></div>

    const list = JSON.parse(localStorage.getItem(ADMIN_KEY));
    if(Array.isArray(list) && list.length){
      let changed = false;
      const mapped = list.map(x => {
        let pass = x.pass;
        if(x.user === 'admin' && pass === 'hi@tianwen2026'){ pass = 'hi@tw2026'; changed = true; }
        return { user: x.user, pass, role: x.role || (x.user === 'admin' ? 'admin' : 'teacher'), scope: x.scope || '', schoolScope: x.schoolScope || '' };
      });
      if(changed) localStorage.setItem(ADMIN_KEY, JSON.stringify(mapped));

/* ===== 数据自动保存到文件 ===== */
let autoSaveDir = null;

function saveDataPayload(){
  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    schools: getSchools(),
    students: getStudents(),
    admins: getAdmins(),
    logs: getLogs()
  };
}

function updateSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  const t = localStorage.getItem('astro_quiz_last_save') || '';
  el.textContent = autoSaveDir
    ? ('自动保存已启用，保存目录：' + autoSaveDir.name + (t ? '，最后保存：' + t : ''))
    : '未选择文件夹：数据仅保存在浏览器本地，更换浏览器或清除缓存会丢失。';
}

async function writeDataFiles(){
  if(!autoSaveDir) return false;
  const json = JSON.stringify(saveDataPayload(), null, 2);
  try {
    const fh = await autoSaveDir.getFileHandle('天文竞赛管理数据.json', { create: true });
    const w = await fh.createWritable();
    await w.write(json);
    await w.close();
    localStorage.setItem('astro_quiz_last_save', new Date().toLocaleString('zh-CN'));
    updateSaveStatus();
    return true;
  } catch(err){
    toast('自动保存失败：' + (err && err.message ? err.message : String(err)));
    return false;
  }
}

function triggerAutoSave(){
  if(!autoSaveDir) return;
  clearTimeout(triggerAutoSave._t);
  triggerAutoSave._t = setTimeout(writeDataFiles, 400);
}

async function pickSaveDir(){
  if(!window.showDirectoryPicker){
    toast('当前浏览器不支持自动保存到文件夹，请用新版 Chrome/Edge 并通过 http(s) 打开，或使用「下载JSON备份」');
    return;
  }
  try {
    autoSaveDir = await window.showDirectoryPicker({ mode: 'readwrite' });
    await writeDataFiles();
    toast('已选择文件夹并完成首次保存');
  } catch(err){
    if(err && err.name === 'AbortError') return;
    toast('选择文件夹失败，已取消自动保存');
  }
}

function downloadBackup(){
  const json = JSON.stringify(saveDataPayload(), null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '天文竞赛管理数据.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  log('下载备份', '导出全部管理数据为 JSON 文件');
  toast('已下载备份文件');
}

/* ===== 考试管理：场次创建、试题导入、开放与关闭 ===== */
const LOCAL_EXAMS_KEY = 'astro_quiz_exams';
let EXAMS = [];
let EXAM_IMPORT = null;
let PORTAL_ON = true;

function loadLocalExams(){
  try { return JSON.parse(localStorage.getItem(LOCAL_EXAMS_KEY) || '[]'); } catch(e){ return []; }
}
function saveLocalExams(){ localStorage.setItem(LOCAL_EXAMS_KEY, JSON.stringify(EXAMS)); }

async function cloudCall(path, opts){
  opts = opts || {};
  const cfg = getCloudConfig();
  if(!cfg.url) throw new Error('未配置云端地址');
  const headers = { 'X-API-Key': cfg.apiKey || '' };
  let body;
  if(opts.body){ headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.body); }
  const res = await fetch(cfg.url.replace(/\/+$/, '') + path, { method: opts.method || 'GET', headers: headers, body: body });
  const j = await res.json();
  if(!j.ok){
    const err = new Error(j.error || ('HTTP ' + res.status));
    err.errors = j.errors || [];
    throw err;
  }
  return j;
}

function examStatusText(s){
  if(s === 'open') return '进行中';
  if(s === 'closed') return '已结束';
  return '未开始';
}
function groupStats(exam, group){
  const qs = (exam.questions || {})[group] || [];
  return { count: qs.length, total: qs.reduce((s, q) => s + (Number(q.score) || 0), 0) };
}

async function refreshExamBoard(){
  const el = document.getElementById('examList');
  if(!el) return;
  const local = loadLocalExams();
  try {
    const j = await cloudCall('/exams');
    PORTAL_ON = j.portal !== false;
    const summaries = j.exams || [];
    const merged = summaries.map(s => {
      const l = local.find(x => x.id === s.id) || {};
      return Object.assign({}, l, s, { questions: l.questions || {} });
    });
    /* 保留尚未上传的本地考试草稿 */
    local.forEach(l => {
      if(!summaries.some(s => s.id === l.id)) merged.push(l);
    });
    EXAMS = merged;
    saveLocalExams();
  } catch(e){
    EXAMS = local;
    if(!EXAMS.length){
      el.innerHTML = '<div class="empty">云端不可达：' + esc(e.message || e) + '<br>可先在本机创建考试并导入试题，稍后上传。</div>';
      renderPortal();
      return;
    }
    toast('云端不可达，显示本机考试草稿');
  }
  renderPortal();
  renderExamBoard();
}

function renderPortal(){
  const btn = document.getElementById('portalToggleBtn');
  const hint = document.getElementById('portalHint');
  if(!btn) return;
  btn.textContent = PORTAL_ON ? '已开启' : '已关闭';
  btn.style.background = PORTAL_ON ? 'rgba(74,222,128,.16)' : 'rgba(248,113,113,.16)';
  btn.style.borderColor = PORTAL_ON ? 'rgba(74,222,128,.5)' : 'rgba(248,113,113,.5)';
  btn.style.color = PORTAL_ON ? 'var(--green)' : 'var(--red)';
  if(hint) hint.textContent = PORTAL_ON ? '点击可关闭，学生将无法进入任何场次' : '点击可开启学生端总入口';
}

async function togglePortal(){
  try {
    const j = await cloudCall('/portal', { method: 'POST', body: { enabled: !PORTAL_ON } });
    PORTAL_ON = !!j.enabled;
    renderPortal();
    toast('学生端总入口已' + (PORTAL_ON ? '开启' : '关闭'));
    log('学生端总开关', PORTAL_ON ? '开启' : '关闭');
  } catch(e){
    toast('操作失败：' + (e.message || e));
  }
}

function renderExamBoard(){
  const el = document.getElementById('examList');
  if(!el) return;
  if(!EXAMS.length){
    el.innerHTML = '<div class="empty">还没有考试。点击右上角「创建考试」，选择参加组别后导入试题。</div>';
    return;
  }
  let html = '';
  EXAMS.forEach(e => {
    const isOpen = e.status === 'open';
    let groupsHtml = '';
    (e.groups || []).forEach(g => {
      const st = groupStats(e, g);
      groupsHtml += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 12px;border:1px solid rgba(91,200,255,.14);border-radius:10px;margin-bottom:8px">'
        + '<div style="font-size:13.5px"><span class="pill-tag">' + esc(g) + '</span>'
        + '<span style="color:var(--muted);margin-left:8px">' + st.count + ' 题 · ' + st.total + ' 分</span></div>'
        + '<button class="btn btn-ghost btn-sm" type="button" data-act="import" data-id="' + esc(e.id) + '" data-group="' + esc(g) + '">'
        + (st.count ? '重新导入' : '导入试题') + '</button></div>';
    });
    html += '<div style="border:1px solid rgba(91,200,255,.22);border-radius:14px;padding:16px;margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
      + '<div><b style="font-size:17px">' + esc(e.name) + '</b>'
      + '<span style="margin-left:10px;font-size:12.5px;font-weight:700;color:' + (isOpen ? 'var(--green)' : (e.status === 'closed' ? 'var(--muted)' : 'var(--gold)')) + '">' + examStatusText(e.status) + '</span></div>'
      + '<div style="font-size:12px;color:var(--muted)">更新 ' + esc(e.updatedAt || '') + '</div></div>'
      + '<div style="margin-top:12px">' + groupsHtml + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
      + '<button class="btn btn-ghost btn-sm" type="button" data-act="upload" data-id="' + esc(e.id) + '">上传 / 更新到云端</button>'
      + (!isOpen ? '<button class="btn btn-gold btn-sm" type="button" data-act="start" data-id="' + esc(e.id) + '">开始此次考试</button>' : '')
      + (isOpen ? '<button class="btn btn-sm" type="button" data-act="end" data-id="' + esc(e.id) + '" style="border-color:rgba(248,113,113,.5);color:var(--red)">结束考试</button>' : '')
      + '<button class="btn btn-ghost btn-sm" type="button" data-act="delete" data-id="' + esc(e.id) + '" style="color:var(--muted)">删除</button>'
      + '</div></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', function(){
      const act = btn.dataset.act;
      const exam = EXAMS.find(x => x.id === btn.dataset.id);
      if(!exam) return;
      if(act === 'import') openImportModal(exam, btn.dataset.group);
      else if(act === 'upload') uploadExam(exam, true);
      else if(act === 'start') startExam(exam);
      else if(act === 'end') endExam(exam);
      else if(act === 'delete') deleteExam(exam);
    });
  });
}

function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadTextFile(name, content, mime){
  const blob = new Blob(['\ufeff' + content], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadExamTemplate(){

  if(window.XLSX){

    ws['!cols'] = [{wch:8},{wch:52},{wch:18},{wch:18},{wch:18},{wch:18},{wch:10},{wch:8},{wch:60},{wch:24},{wch:28}];

function splitCsvLine(line){
  const out = []; let cur = ''; let quoted = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(quoted){
      if(c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if(c === '"'){ quoted = false; }
      else cur += c;
    } else if(c === '"'){ quoted = true; }
    else if(c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function parseCsvText(text){
  return text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim() !== '').map(splitCsvLine);
}

function normalizeQuestionRows(rows){
  if(!rows.length) return [];
  const first = String(rows[0][0] || '').trim();
  if(/题号|序号|no/i.test(first)) rows = rows.slice(1);
  return rows.filter(r => r && String(r[0] == null ? '' : r[0]).trim() !== '').map((r, i) => ({
    no: parseInt(r[0], 10) || (i + 1),
    stem: String(r[1] == null ? '' : r[1]).trim(),
    options: ['A','B','C','D'].map((k, idx) => ({ key: k, text: String(r[2+idx] == null ? '' : r[2+idx]).trim() })),
    answer: String(r[6] == null ? '' : r[6]).trim().toUpperCase(),
    score: Number(r[7]) || 0,
    analysis: String(r[8] == null ? '' : r[8]).trim() ? [String(r[8]).trim()] : [],
    points: String(r[9] == null ? '' : r[9]).trim() ? [String(r[9]).trim()] : [],
    tips: String(r[10] == null ? '' : r[10]).trim()
  }));
}

function normalizeQuestionObjects(arr){
  return arr.map((o, i) => {
    let options = o.options || o.选项 || [];
    if(!Array.isArray(options)){
      options = ['A','B','C','D'].map(k => ({ key: k, text: String(options[k] || o['选项' + k] || '').trim() }));
    } else if(options.length && typeof options[0] === 'string'){
      options = options.map((t, idx) => ({ key: ['A','B','C','D'][idx], text: String(t).trim() }));
    }
    const analysis = o.analysis || o.解析 || [];
    const points = o.points || o.知识点 || [];
    return {
      no: parseInt(o.no != null ? o.no : (o.题号 != null ? o.题号 : (i + 1)), 10),
      stem: String(o.stem != null ? o.stem : (o.题干 || '')).trim(),
      options: options.map((x, idx) => ({ key: String(x.key || ['A','B','C','D'][idx]), text: String(x.text || x.value || '').trim() })),
      answer: String(o.answer != null ? o.answer : (o.正确答案 || '')).trim().toUpperCase(),
      score: Number(o.score != null ? o.score : (o.分值 || 0)),
      analysis: (Array.isArray(analysis) ? analysis : String(analysis).split(/\n+/)).filter(Boolean).map(s => String(s).trim()),
      points: (Array.isArray(points) ? points : String(points).split(/\n+/)).filter(Boolean).map(s => String(s).trim()),
      tips: String(o.tips != null ? o.tips : (o.易错提醒 || '')).trim()
    };
  });
}

async function readExamFile(file){
  const fname = file.name.toLowerCase();
  if(fname.endsWith('.json')){
    const data = JSON.parse(await file.text());
    const arr = Array.isArray(data) ? data : (Array.isArray(data.questions) ? data.questions : []);
    return normalizeQuestionObjects(arr);
  }
  if(fname.endsWith('.csv')){
    return normalizeQuestionRows(parseCsvText(await file.text()));
  }
  if(fname.endsWith('.xlsx') || fname.endsWith('.xls')){
    if(!window.XLSX) throw new Error('Excel 解析组件未加载，请改用 CSV / JSON，或联网后重试');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return normalizeQuestionRows(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }));
  }
  throw new Error('只支持 .xlsx / .xls / .csv / .json 文件');
}

function validateQuestionList(list){
  const errors = [];
  if(!list.length) errors.push({ idx: -1, msg: '文件中没有可识别的题目' });
  const nos = {};
  list.forEach((q, i) => {
    const tag = '第 ' + (i + 1) + ' 行（题号 ' + q.no + '）';
    if(!q.no || q.no < 1) errors.push({ idx: i, msg: tag + '：题号无效' });
    if(q.no in nos) errors.push({ idx: i, msg: tag + '：题号重复' });
    nos[q.no] = true;
    if(!q.stem) errors.push({ idx: i, msg: tag + '：题干为空' });
    ['A','B','C','D'].forEach(k => {
      const o = (q.options || []).find(x => x.key === k);
      if(!o || !o.text) errors.push({ idx: i, msg: tag + '：选项' + k + '为空' });
    });
    if(['A','B','C','D'].indexOf(q.answer) < 0) errors.push({ idx: i, msg: tag + '：正确答案须为 A/B/C/D' });
    if(!(q.score > 0)) errors.push({ idx: i, msg: tag + '：分值须大于 0' });
    if(!(q.analysis || []).length) errors.push({ idx: i, msg: tag + '：解析不能为空' });
  });
  return errors;
}

function examPayload(exam){
  return {
    id: exam.id, name: exam.name, groups: exam.groups,
    status: exam.status, questions: exam.questions || {}, updatedAt: exam.updatedAt || new Date().toLocaleString()
  };
}

async function uploadExam(exam, silent){
  try {
    const j = await cloudCall('/exams', { method: 'POST', body: { exam: examPayload(exam) } });
    const perGroup = (j.exam && j.exam.perGroup) || {};
    const mismatch = [];
    (exam.groups || []).forEach(g => {
      const l = groupStats(exam, g);
      const r = perGroup[g] || { count: 0, totalScore: 0 };
      if(r.count !== l.count || r.totalScore !== l.total){
        mismatch.push(g + '（本地 ' + l.count + ' 题/' + l.total + ' 分，云端 ' + r.count + ' 题/' + r.totalScore + ' 分）');
      }
    });
    if(mismatch.length){
      toast('上传后核对不一致：' + mismatch.join('；') + '。请重新导入后再上传');
      return false;
    }
    if(!silent) toast('已上传并核对：' + (exam.groups || []).length + ' 个组别，题数与总分一致');
    log('上传考试', exam.name);
    return true;
  } catch(e){
    const detail = (e.errors && e.errors.length) ? '：' + e.errors.slice(0, 2).join('；') : '';
    toast('上传失败：' + (e.message || e) + detail);
    return false;
  }
}

async function startExam(exam){
  const missing = (exam.groups || []).filter(g => !((exam.questions || {})[g] || []).length);
  if(missing.length){ toast('请先为 ' + missing.join('、') + ' 导入试题'); return; }
  const ok = await uploadExam(exam, true);
  if(!ok) return;
  try {
    await cloudCall('/exam-status', { method: 'POST', body: { id: exam.id, status: 'open' } });
    exam.status = 'open'; exam.updatedAt = new Date().toLocaleString();
    saveLocalExams(); renderExamBoard();

}

  });
  const j = await r.json();

function mergeCloudIntoLocal(cloudRecords){
  if(!cloudRecords.length) return 0;
  const local = getRecords();
  const keyOf = r => [r.submitTime, r.name, r.examNo, r.school, r.group].join('||');
  const have = new Set(local.map(keyOf));
  let added = 0;
  cloudRecords.forEach(c => {
    const rec = {
      id: (Date.parse(c.submitTime) || Date.now()) + added,
      examId: c.examId || '',
      examName: c.examName || '',
      name: c.name, school: c.school, examNo: c.examNo, group: c.group,
      answers: c.answers || {},
      qTimes: c.qTimes || {},
      details: c.details || [],
      score: c.score, correct: c.correct, wrong: c.wrong, unknown: c.unknown,
      wrongNos: c.wrongNos || [],
      duration: c.duration,
      submitTime: c.submitTime
    };
    const k = keyOf(rec);
    if(!have.has(k)){ local.push(rec); have.add(k); added++; }
  });
  if(added) saveRecords(local);
  return added;
}
async function syncCloudThenRender(){
  const cfg = getCloudConfig();
  if(cfg.url){
    try {
      const cloud = await pullCloudRecords();
      const added = mergeCloudIntoLocal(cloud);
      if(added) toast('已从云端同步 ' + added + ' 条记录');
    } catch(e){
      toast('云端同步失败：' + (e.message || e));
    }
  }
  renderAdmin();
}

/* ===== 通用 UI ===== */
function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  const fa = document.getElementById('floatActions');
  if(fa){ fa.classList.toggle('show', id === 'view-result'); }
  window.scrollTo({ top: 0 });
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmtTime(sec){
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor(sec%3600/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return h + ':' + m + ':' + s;
}
function fmtShort(sec){
  sec = Math.floor(sec);
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  if(sec >= 3600){ return Math.floor(sec/3600) + ':' + m + ':' + s; }
  return m + ':' + s;
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }

/* ===== 宇宙星空背景 ===== */
(function starrySky(){
  const cv = document.getElementById('starCanvas');
  const ctx = cv.getContext('2d');
  let stars = [], meteors = [], w = 0, h = 0;
  function resize(){
    w = cv.width = window.innerWidth;
    h = cv.height = window.innerHeight;
    const n = Math.min(260, Math.floor(w*h/6500));
    stars = [];
    for(let i=0;i<n;i++){
      stars.push({
        x: Math.random()*w, y: Math.random()*h,
        r: Math.random()*1.4 + 0.3,
        tw: Math.random()*Math.PI*2,
        sp: Math.random()*0.025 + 0.006
      });
    }
  }
  function spawnMeteor(){
    if(Math.random() < 0.004 && meteors.length < 2){
      meteors.push({x: Math.random()*w*0.8 + w*0.2, y: Math.random()*h*0.3,
        len: Math.random()*90+70, sp: Math.random()*6+7, life:1});
    }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      st.tw += st.sp;
      const a = 0.35 + Math.abs(Math.sin(st.tw))*0.65;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(220,232,255,' + a.toFixed(2) + ')';
      ctx.fill();
    }
    spawnMeteor();
    for(let i=meteors.length-1;i>=0;i--){
      const me = meteors[i];
      me.x -= me.sp; me.y += me.sp*0.55; me.life -= 0.012;
      const grad = ctx.createLinearGradient(me.x, me.y, me.x+me.len, me.y-me.len*0.55);
      grad.addColorStop(0,'rgba(255,255,255,' + Math.max(me.life,0) + ')');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(me.x, me.y);
      ctx.lineTo(me.x+me.len, me.y-me.len*0.55); ctx.stroke();
      if(me.life<=0 || me.x< -100) meteors.splice(i,1);
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

/* ===== 答题页渲染 ===== */
/* 统一获取含 E（不知道）的选项列表 */
function getOptions(q){
  return q.options.concat([{key:'E', text:'不知道'}]);
}
/* 判定单题结果：correct / unknown（选E，0分）/ wrong */
function judgeAnswer(stu, q){
  if(stu === q.answer) return 'correct';
  if(stu === 'E') return 'unknown';
  return 'wrong';
}

/* ===== 管理员后台 ===== */
function roleLabel(a){
  if(a.role === 'admin') return '超级管理员';
  if(a.role === 'subadmin') return '子管理员';
  return '普通教师 · ' + (a.scope || '小学组') + ' · ' + (a.schoolScope || '未关联学校');
}

function renderSchoolMgmt(){
  const el = document.getElementById('schoolMgmtBody');
  if(!el) return;
  const schools = getSchools();
  const students = getStudents();
  if(!schools.length){
    el.innerHTML = '<div class="empty">尚未添加学校，点击右上角「添加学校」开始。</div>';
    return;
  }
  let html = '';
  schools.forEach(s => {
    let stuHtml = '';
    let stuCount = 0;
    students.forEach((st, idx) => {
      if(st.school !== s) return;
      stuCount++;
      stuHtml += '<span style="font-size:13px;padding:4px 8px;border-radius:8px;background:' + (st.auto ? 'rgba(255,210,120,.1)' : 'rgba(91,200,255,.1)') + ';border:1px solid var(--line);margin:3px">'
        + esc(st.name) + ' · ' + esc(st.examNo) + ' · ' + st.group + (st.auto ? ' <i style="color:var(--gold);font-style:normal;font-size:11px">自动登记</i>' : '')
        + ' <a href="javascript:void(0)" data-delstu="' + idx + '" style="color:var(--red);text-decoration:none">×</a></span>';
    });
    html += '<div style="border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px;margin-bottom:10px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
      + '<b>' + esc(s) + '</b>'
      + '<span style="color:var(--muted);font-size:13px">' + stuCount + ' 名学生</span>'
      + '<div style="display:flex;gap:8px">'
      + '<button class="btn btn-ghost btn-sm" type="button" data-addstu="' + esc(s) + '">添加学生</button>'
      + '<button class="btn btn-danger btn-sm" type="button" data-delschool="' + esc(s) + '">删除学校</button>'
      + '</div></div>'
      + (stuHtml ? '<div style="margin-top:10px;display:flex;flex-wrap:wrap">' + stuHtml + '</div>' : '<div style="margin-top:8px;color:var(--muted);font-size:13px">该校尚未添加学生。</div>')
      + '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-addstu]').forEach(b => b.addEventListener('click', () => openAddStudent(b.dataset.addstu)));
  el.querySelectorAll('[data-delschool]').forEach(b => b.addEventListener('click', () => deleteSchool(b.dataset.delschool)));
  el.querySelectorAll('[data-delstu]').forEach(a => a.addEventListener('click', () => deleteStudent(parseInt(a.dataset.delstu, 10))));
}

function openAddStudent(school){

    + '<div class="field" style="margin-bottom:12px">'
    + '<label for="stuName">姓名</label>'
    + '<input id="stuName" type="text" placeholder="请输入学生姓名" maxlength="20">'
    + '</div>'
    + '<div class="field" style="margin-bottom:12px">'
    + '<label for="stuExamNo">考号</label>'
    + '<input id="stuExamNo" type="text" placeholder="请输入考号" maxlength="20">'
    + '</div>'
    + '<div class="field" style="margin-bottom:12px">'
    + '<label>组别</label>'
    + '<div class="radio-row">'
    + '<label class="radio-pill"><input type="radio" name="stuGroup" value="小学组" checked><span>小学组</span></label>'
    + '<label class="radio-pill"><input type="radio" name="stuGroup" value="初中组"><span>初中组</span></label>'
    + '<label class="radio-pill"><input type="radio" name="stuGroup" value="高中组"><span>高中组</span></label>'
    + '</div>'
    + '</div>'
    + '<div style="display:flex;gap:10px;margin-top:20px">'
    + '<button class="btn btn-ghost" style="flex:1" id="stuCancel" type="button">取消</button>'
    + '<button class="btn btn-gold" style="flex:1" id="stuOk" type="button">确认添加</button></div>');
  document.getElementById('stuCancel').addEventListener('click', closeModal);
  document.getElementById('stuOk').addEventListener('click', function(){
    const name = document.getElementById('stuName').value.trim();
    const examNo = document.getElementById('stuExamNo').value.trim();
    const group = document.querySelector('input[name="stuGroup"]:checked').value;
    if(!name || !examNo){ toast('请填写姓名与考号'); return; }
    const students = getStudents();
    if(students.some(st => st.school === school && st.examNo === examNo && st.group === group)){
      toast('该校该组别下该考号已存在'); return;
    }
    students.push({ name: name, examNo: examNo, school: school, group: group });
    saveStudents(students);
    closeModal();
    renderSchoolMgmt();
    log('添加学生', school + ' ' + name + '（' + examNo + '，' + group + '）');
    toast('学生已添加');
  });
}

function deleteSchool(school){
  openModal('<div class="modal-head"><h3>删除学校？</h3></div>'
    + '<p style="color:var(--muted);font-size:14.5px">将删除学校「' + esc(school) + '」及其名下全部学生登记，删除后不可恢复。</p>'
    + '<div style="display:flex;gap:10px;margin-top:20px">'
    + '<button class="btn btn-ghost" style="flex:1" id="dsCancel" type="button">取消</button>'
    + '<button class="btn btn-danger" style="flex:1" id="dsOk" type="button">确认删除</button></div>');
  document.getElementById('dsCancel').addEventListener('click', closeModal);
  document.getElementById('dsOk').addEventListener('click', function(){
    saveSchools(getSchools().filter(s => s !== school));
    saveStudents(getStudents().filter(st => st.school !== school));
    closeModal();
    renderSchoolMgmt();
    log('删除学校', school);
    toast('学校已删除');
  });
}

function deleteStudent(idx){
  const students = getStudents();
  const st = students[idx];
  if(!st){ return; }
  openModal('<div class="modal-head"><h3>删除学生？</h3></div>'
    + '<p style="color:var(--muted);font-size:14.5px">将删除「' + esc(st.school) + '」的学生 ' + esc(st.name) + '（考号 ' + esc(st.examNo) + '）。</p>'
    + '<div style="display:flex;gap:10px;margin-top:20px">'
    + '<button class="btn btn-ghost" style="flex:1" id="dstCancel" type="button">取消</button>'
    + '<button class="btn btn-danger" style="flex:1" id="dstOk" type="button">确认删除</button></div>');
  document.getElementById('dstCancel').addEventListener('click', closeModal);
  document.getElementById('dstOk').addEventListener('click', function(){
    const list = getStudents();
    list.splice(idx, 1);
    saveStudents(list);
    closeModal();
    renderSchoolMgmt();
    log('删除学生', st.school + ' ' + st.name + '（' + st.examNo + '）');
    toast('学生已删除');
  });
}

  if(!logs.length){ el.innerHTML = '<div class="empty">暂无操作日志</div>'; return; }

    '<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px">'

    + ' <b style="color:var(--accent)">' + esc(l.operator) + '</b>'
    + ' <span>' + esc(l.action) + '</span>'
    + (l.detail ? ' <span style="color:var(--muted)">' + esc(l.detail) + '</span>' : '')
    + '</div>'
  ).join('');

  const admins = getAdmins();
  const a = admins.find(x => x.user === user);
  if(!a){ toast('未找到该账号'); return; }
  if(a.role === 'admin'){ toast('超级管理员账号不可删除'); return; }
  openModal('<div class="modal-head"><h3>删除账号？</h3></div>'
    + '<p style="color:var(--muted);font-size:14.5px">将删除教师账号「' + esc(user) + '」（' + roleLabel(a) + '），删除后不可恢复。</p>'
    + '<div style="display:flex;gap:10px;margin-top:20px">'
    + '<button class="btn btn-ghost" style="flex:1" id="daCancel" type="button">取消</button>'
    + '<button class="btn btn-danger" style="flex:1" id="daOk" type="button">确认删除</button></div>');

    log('删除账号', '账号 ' + user + ' → ' + roleLabel(a));
    toast('账号已删除');
  });
}

function openSetRole(user){
  const initial = getAdmins().find(x => x.user === user);
  if(!initial) return;
  const curScope = initial.scope || '小学组';
  const curSchoolScope = initial.schoolScope || '全部';
  const schoolOpts = '<option value="全部" ' + (curSchoolScope === '全部' ? 'selected' : '') + '>全部学校</option>'
    + getSchools().map(s => '<option value="' + esc(s) + '" ' + (curSchoolScope === s ? 'selected' : '') + '>' + esc(s) + '</option>').join('');
  openModal('<div class="modal-head"><h3>设置权限 · ' + esc(user) + '</h3></div>'
    + '<p style="color:var(--muted);font-size:13.5px;margin-bottom:14px">超级管理员可管理学校/学生/账号并清空；子管理员仅查看与导出；普通教师仅查看本校指定组别并导出。</p>'
    + '<div class="field">'
    + '<label>权限等级</label>'
    + '<div class="radio-row">'
    + '<label class="radio-pill"><input type="radio" name="roleChoice" value="admin" ' + (initial.role === 'admin' ? 'checked' : '') + '><span>超级管理员</span></label>'
    + '<label class="radio-pill"><input type="radio" name="roleChoice" value="subadmin" ' + (initial.role === 'subadmin' ? 'checked' : '') + '><span>子管理员</span></label>'
    + '<label class="radio-pill"><input type="radio" name="roleChoice" value="teacher" ' + (initial.role === 'teacher' ? 'checked' : '') + '><span>普通教师</span></label>'
    + '</div>'
    + '</div>'
    + '<div class="field" id="roleTeacherField" style="' + (initial.role === 'teacher' ? '' : 'display:none') + '">'
    + '<label>可查看组别</label>'
    + '<div class="radio-row">'
    + '<label class="radio-pill"><input type="radio" name="roleScope" value="小学组" ' + (curScope === '小学组' ? 'checked' : '') + '><span>小学组</span></label>'
    + '<label class="radio-pill"><input type="radio" name="roleScope" value="初中组" ' + (curScope === '初中组' ? 'checked' : '') + '><span>初中组</span></label>'
    + '<label class="radio-pill"><input type="radio" name="roleScope" value="高中组" ' + (curScope === '高中组' ? 'checked' : '') + '><span>高中组</span></label>'
    + '</div>'
    + '</div>'
    + '<div class="field" id="roleSchoolField" style="' + (initial.role === 'teacher' ? '' : 'display:none') + '">'
    + '<label>关联学校（必选，可选全部）</label>'
    + '<select id="roleSchoolScope" style="width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(8,13,32,.85);color:var(--text);font-size:16px;outline:none">'
    + schoolOpts
    + '</select>'
    + '</div>'
    + '<div style="display:flex;gap:10px;margin-top:20px">'
    + '<button class="btn btn-ghost" style="flex:1" id="roleCancel" type="button">取消</button>'
    + '<button class="btn btn-gold" style="flex:1" id="roleOk" type="button">确认保存</button></div>');
  document.getElementById('roleCancel').addEventListener('click', closeModal);
  document.querySelectorAll('input[name="roleChoice"]').forEach(r => {
    r.addEventListener('change', function(){
      const isTeacher = this.value === 'teacher';
      document.getElementById('roleTeacherField').style.display = isTeacher ? '' : 'none';
      document.getElementById('roleSchoolField').style.display = isTeacher ? '' : 'none';
    });
  });
  document.getElementById('roleOk').addEventListener('click', function(){
    const role = document.querySelector('input[name="roleChoice"]:checked').value;
    const scope = role === 'teacher' ? document.querySelector('input[name="roleScope"]:checked').value : '';
    const schoolScope = role === 'teacher' ? document.getElementById('roleSchoolScope').value : '';
    const admins = getAdmins();
    const a = admins.find(x => x.user === user);
    if(!a){ toast('未找到该账号'); return; }
    if(role === 'teacher' && a.role === 'admin'){
      const superCount = admins.filter(x => x.role === 'admin').length;
      if(superCount <= 1){ toast('至少保留一个超级管理员'); return; }
    }
    a.role = role;
    a.scope = scope;
    a.schoolScope = schoolScope;
    saveAdmins(admins);
    closeModal();
    renderAdminList();
    applyAdminRole();
    if(currentAdmin && currentAdmin.user === user){
      currentAdmin = getAdmins().find(x => x.user === user) || currentAdmin;
      renderAdmin();
    }
    log('设置权限', '账号 ' + user + ' → ' + roleLabel(a));
    toast('权限已更新');
  });
}

let adminPage = 'scores';
function switchAdminPage(page){
  const manageTab = document.getElementById('tabManage');
  const manageAllowed = manageTab && manageTab.style.display !== 'none';
  const target = (page === 'manage' && manageAllowed) ? 'manage' : 'scores';
  adminPage = target;
  document.querySelectorAll('.admin-page').forEach(function(el){
    el.classList.toggle('active', el.id === (target === 'manage' ? 'adminPageManage' : 'adminPageScores'));
  });
  document.querySelectorAll('.admin-tab').forEach(function(btn){
    const on = btn.dataset.page === target;
    btn.classList.toggle('on', on);

function renderAdmin(){
  applyAdminRole();
  renderAdminList();
  renderSchoolMgmt();
  renderLogs();
  setupGroupFilter();
  const records = visibleRecords();
  const count = records.length;

  if(count === 0){
    document.getElementById('kpiCount').textContent = '0';
    document.getElementById('kpiAvg').textContent = '0';
    document.getElementById('kpiMax').textContent = '0';
    document.getElementById('kpiRate').textContent = '0%';
    document.getElementById('scoreBars').innerHTML = '';
    document.getElementById('filterSchool').innerHTML = '<option value="">全部学校</option>';
    document.getElementById('adminTbody').innerHTML = '<tr><td colspan="10"><div class="empty">暂无学生提交记录</div></td></tr>';
    return;
  }

  const scores = records.map(r => r.score);
  const avg = scores.reduce((a,b)=>a+b,0)/count;
  const max = Math.max.apply(null, scores);
  const avgRate = records.reduce((s,r) => s + r.correct/(r.correct+r.wrong), 0)/count*100;

  document.getElementById('kpiCount').textContent = count;
  document.getElementById('kpiAvg').textContent = avg.toFixed(1);
  document.getElementById('kpiMax').textContent = max;
  document.getElementById('kpiRate').textContent = Math.round(avgRate) + '%';

  /* 分数段分布 */
  const bands = [
    {label:'低于0', min:-200, max:0},
    {label:'0-39', min:0, max:40},
    {label:'40-59', min:40, max:60},
    {label:'60-79', min:60, max:80},
    {label:'80-99', min:80, max:100},
    {label:'100-120', min:100, max:121}
  ];
  const counts = bands.map(b => records.filter(r => r.score >= b.min && r.score < b.max).length);
  const peak = Math.max.apply(null, counts.concat([1]));
  let barHtml = '';
  bands.forEach((b, i) => {
    const height = counts[i]/peak*100;
    barHtml += '<div class="bar-col"><span>' + counts[i] + ' 人</span><i style="height:' + height + '%"></i><span>' + b.label + '</span></div>';
  });
  document.getElementById('scoreBars').innerHTML = barHtml;

  /* 学校筛选下拉（保留当前选择） */
  const schoolSel = document.getElementById('filterSchool');
  const curSchool = schoolSel.value;
  const schools = Array.from(new Set(records.map(r => r.school))).sort();
  if(currentAdmin && currentAdmin.role === 'teacher' && currentAdmin.schoolScope && currentAdmin.schoolScope !== '全部'){
    schoolSel.innerHTML = '<option value="' + esc(currentAdmin.schoolScope) + '">' + esc(currentAdmin.schoolScope) + '</option>';
    schoolSel.value = currentAdmin.schoolScope;
    schoolSel.disabled = true;
  } else {
    schoolSel.innerHTML = '<option value="">全部学校</option>'
      + schools.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
    schoolSel.value = schools.indexOf(curSchool) >= 0 ? curSchool : '';
    schoolSel.disabled = false;
  }

  renderAdminTable();
}

function showStudentDetail(id){
  const r = visibleRecords().find(x => x.id === id);
  if(!r) return;
  /* 新考试记录带 details：就地生成题目快照与作答/用时，兼容旧 35 题记录 */
  if(Array.isArray(r.details) && r.details.length){
    r._qs = r.details.map(d => ({
      no: d.no, stem: d.stem, options: d.options || [], answer: d.answer,
      analysis: d.analysis || [], points: d.points || [], tips: d.tips || ''
    }));
    if(!r.answers) r.answers = {};
    r.details.forEach(d => { r.answers[d.no] = d.stu; });
    if(!r.qTimes || !Object.keys(r.qTimes).length){
      r.qTimes = {};
      r.details.forEach(d => { if(d.time != null) r.qTimes[d.no] = d.time; });
    }
  }
  const src = r._qs || ALL_DATA;
  const nos = (r.details && r.details.length)
    ? r.details.map(d => d.no)
    : Object.keys(r.answers).map(Number).sort((a,b)=>a-b);
  let html = '<div class="modal-head"><h3>' + esc(r.name) + ' · 答题详情</h3>'
    + '<button class="modal-close" id="modalX" type="button">×</button></div>'

    + '考号 ' + esc(r.examNo || '') + ' ｜ ' + esc(r.school) + ' ｜ ' + r.group + ' ｜ 得分 <b style="color:var(--gold)">' + r.score
    + '</b> ｜ 正确 ' + r.correct + ' ｜ 错误 ' + r.wrong
    + ' ｜ 选 E ' + (r.unknown||0) + ' ｜ 用时 ' + fmtTime(r.duration) + '</p>';

  html += '<h4 style="color:var(--accent);margin-bottom:8px">逐题作答情况（点击题号展开题目与解析）</h4>';
  nos.forEach(no => {
    const q = src.find(x => x.no === no);
    const stu = r.answers[no];
    const v = judgeAnswer(stu, q);
    const used = r.qTimes ? r.qTimes[no] : null;

    let headCls, headTxt;
    if(v === 'correct'){ headCls = 'var(--green)'; headTxt = '正确'; }
    else if(v === 'unknown'){ headCls = 'var(--gold)'; headTxt = '选E（0分）'; }
    else { headCls = 'var(--red)'; headTxt = '错误'; }

    html += '<div class="detail-box" style="margin-bottom:10px;padding:0;overflow:hidden">'
      + '<button class="q-expand-head" type="button" data-expand="' + no + '">'
      + '<b>第 ' + no + ' 题</b>'
      + '<span>学生答案：<span style="color:' + headCls + '">' + stu + '</span></span>'
      + '<span>正确答案：<span style="color:var(--green)">' + q.answer + '</span></span>'
      + '<span style="color:' + headCls + '">' + headTxt + '</span>'
      + '<span style="color:var(--gold)">用时 ' + ((used!==null&&used!==undefined)?fmtShort(used):'—') + '</span>'
      + '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
      + '</button>'
      + '<div class="q-expand-body" id="expand-' + no + '" style="display:none">'
      + '<div class="mini-stem">' + esc(q.stem) + '</div>';

    getOptions(q).forEach(o => {
      let cls = 'mini-opt';
      if(o.key === q.answer) cls += ' is-correct';
      else if(o.key === stu) cls += (v === 'unknown' ? 'is-unknown' : 'is-wrong');
      html += '<div class="' + cls + '"><span class="mk">' + o.key + '</span><span>' + esc(o.text) + '</span></div>';
    });

    let meta = '学生答案：' + stu + ' ｜ 正确答案：' + q.answer;
    if(used !== null && used !== undefined){ meta += ' ｜ 本题用时：' + fmtShort(used); }
    html += '<div class="mini-meta">' + meta + '</div>';
    html += '<h5>解析</h5>';
    q.analysis.forEach(a => { html += '<div class="mini-li">' + esc(a) + '</div>'; });
    html += '<h5>知识点梳理</h5>';
    q.points.forEach(p => { html += '<div class="mini-li">' + esc(p) + '</div>'; });
    html += '</div></div>';
  });

  if(r.wrongNos.length){
    html += '<h4 style="color:var(--red);margin:16px 0 8px">错题题号汇总</h4>';
    html += '<p style="font-size:14.5px">' + r.wrongNos.join('、') + '</p>';
  } else {
    html += '<p style="color:var(--green);margin-top:14px">该学生全部答对，无错题。</p>';
  }
  openModal(html);
  document.getElementById('modalX').addEventListener('click', closeModal);
  document.querySelectorAll('.q-expand-head').forEach(h => {
    h.addEventListener('click', () => {
      const body = document.getElementById('expand-' + h.dataset.expand);
      const isOpen = body.style.display === 'block';
      body.style.display = isOpen ? 'none' : 'block';
      h.classList.toggle('open', !isOpen);
    });
  });
}

/* ===== 无依赖 XLSX 生成（ZIP store + CRC32 + 内联字符串） ===== */
function xmlEsc(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++){ c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); }
    t[n] = c>>>0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){ c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8); }
  return (c ^ 0xFFFFFFFF)>>>0;
}
function colLetter(n){
  let s=''; n++;
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}
function sheetXml(rows){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row, ri) => {
    x += '<row r="' + (ri+1) + '">';
    row.forEach((val, ci) => {
      const ref = colLetter(ci) + (ri+1);
      if(typeof val === 'number' && isFinite(val)){
        x += '<c r="' + ref + '"><v>' + val + '</v></c>';
      } else {
        x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(val) + '</t></is></c>';
      }
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function buildZip(files){
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for(const f of files){
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true);
    lh.setUint16(12, 0x0021, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameBytes, data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, 0x0021, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameBytes);

    offset += 30 + nameBytes.length + data.length;
  }
  let centralSize = 0;
  central.forEach(c => centralSize += c.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]),
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

  const s2Header = ['姓名','考号','学校','组别'];

    s2Header.push('D' + String(i).padStart(3,'0'), 'T' + String(i).padStart(3,'0'));
  }

        cells[i*2] = d.stu || '';
        const pts = d.verdict === 'correct' ? d.score : (d.verdict === 'unknown' ? 0 : -d.score);
        cells[i*2+1] = pts;
      });

        const stu = r.answers[no];
        if(stu === undefined || stu === null) return;
        const q = ALL_DATA.find(x => x.no === no);
        const v = judgeAnswer(stu, q);
        cells[i*2] = stu;
        cells[i*2+1] = v === 'correct' ? 4 : (v === 'unknown' ? 0 : -4);
      });
    }
    return row.concat(cells);
  });

  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    + '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + '<sheet name="成绩汇总" sheetId="1" r:id="rId1"/>'
    + '<sheet name="答题明细" sheetId="2" r:id="rId2"/></sheets></workbook>';
  const wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
    + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>'
    + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>'
    + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
    + '<borders count="1"><border/></borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs></styleSheet>';

  const zipFiles = [
    {name:'[Content_Types].xml', data: enc.encode(contentTypes)},
    {name:'_rels/.rels', data: enc.encode(rootRels)},
    {name:'xl/workbook.xml', data: enc.encode(workbook)},
    {name:'xl/_rels/workbook.xml.rels', data: enc.encode(wbRels)},
    {name:'xl/styles.xml', data: enc.encode(styles)},
    {name:'xl/worksheets/sheet1.xml', data: enc.encode(sheetXml([s1Header].concat(s1Rows)))},
    {name:'xl/worksheets/sheet2.xml', data: enc.encode(sheetXml([s2Header].concat(s2Rows)))}
  ];
  const blob = buildZip(zipFiles);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '天文竞赛成绩与答题明细.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  log('导出成绩', '导出 Excel 双工作表');
  toast('Excel（含两个工作表）已导出');
});

/* 清空所有学生答题数据 */
document.getElementById('clearAllBtn').addEventListener('click', function(){
  if(!getRecords().length){ toast('当前没有任何数据'); return; }
  openModal('<div class="modal-head"><h3>确认清空所有学生数据？</h3></div>'
    + '<p style="color:var(--muted);font-size:14.5px">将删除全部学生的成绩、答案与错题记录，清空后无法恢复，请谨慎操作。</p>'
    + '<div style="display:flex;gap:10px;margin-top:20px">'
    + '<button class="btn btn-ghost" style="flex:1" id="clearCancel" type="button">取消</button>'
    + '<button class="btn btn-danger" style="flex:1" id="clearOk" type="button">确认清空</button></div>');
  document.getElementById('clearCancel').addEventListener('click', closeModal);
  document.getElementById('clearOk').addEventListener('click', function(){
    localStorage.removeItem(RECORD_KEY);
    closeModal();
    log('清空数据', '清除所有学生答题记录');
    renderAdmin();
    toast('所有学生答题数据已清除');
  });
});

document.querySelectorAll('.admin-tab').forEach(function(btn){
  btn.addEventListener('click', function(){ switchAdminPage(btn.dataset.page); });
});
document.getElementById('adminTabs').addEventListener('keydown', function(e){
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tabs = Array.from(document.querySelectorAll('.admin-tab')).filter(function(t){ return t.style.display !== 'none'; });
  if(tabs.length < 2) return;
  const i = tabs.indexOf(document.activeElement);
  const next = e.key === 'ArrowRight' ? tabs[(i + 1 + tabs.length) % tabs.length] : tabs[(i - 1 + tabs.length) % tabs.length];
  next.focus();
  switchAdminPage(next.dataset.page);
});

document.getElementById('adminLogout').addEventListener('click', () => { switchAdminPage('scores'); showView('view-login'); });
document.getElementById('filterSchool').addEventListener('change', renderAdminTable);
document.getElementById('filterGroup').addEventListener('change', renderAdminTable);
document.getElementById('modalMask').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
</script>
</body>
</html>
